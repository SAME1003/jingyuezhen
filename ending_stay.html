<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结局 A · 沉沦 - 景月镇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #ccc;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }
  .ending-container {
    max-width: 600px;
    width: 100%;
    animation: fadeIn 2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ending-title {
    font-size: 28px;
    color: #c41e3a;
    text-align: center;
    margin-bottom: 50px;
    letter-spacing: 8px;
    text-shadow: 0 0 20px rgba(196,30,58,0.5);
  }
  .ending-content {
    font-size: 15px;
    line-height: 2.4;
    color: #bbb;
    margin-bottom: 40px;
  }
  .ending-content p {
    margin-bottom: 18px;
    text-indent: 2em;
  }
  .ending-content .epilogue {
    color: #777;
    margin-top: 30px;
    font-size: 14px;
  }
  .ending-progress {
    text-align: center;
    color: #555;
    font-size: 12px;
    margin-top: 40px;
    letter-spacing: 2px;
  }
  .ending-actions {
    text-align: center;
    margin-top: 50px;
  }
  .restart-btn {
    background: transparent;
    border: 1px solid #444;
    color: #888;
    padding: 12px 40px;
    font-size: 14px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .restart-btn:hover {
    border-color: #c41e3a;
    color: #c41e3a;
    box-shadow: 0 0 15px rgba(196,30,58,0.3);
  }
  .water-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,30,50,0.1) 0%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    animation: waterPulse 4s ease-in-out infinite;
  }
  @keyframes waterPulse {
    0%,100% { opacity: 0.5; }
    50% { opacity: 0.8; }
  }

/* 移动端适配 */
@media (max-width: 768px) {
  body { padding: 10px; }
  .container, .main-content, .content, .wrapper { max-width: 100% !important; width: 100% !important; padding: 0 10px !important; }
  table { display: block; overflow-x: auto; white-space: nowrap; }
  img { max-width: 100%; height: auto; }
  h1 { font-size: 20px !important; }
  h2 { font-size: 18px !important; }
  h3 { font-size: 16px !important; }
  p, li, td, th { font-size: 13px !important; line-height: 1.6 !important; }
  .person-section, .person-header { flex-direction: column !important; align-items: flex-start !important; }
  .avatar { width: 50px !important; height: 60px !important; }
}
@media (max-width: 480px) {
  h1 { font-size: 18px !important; }
  h2 { font-size: 16px !important; }
  p, li, td, th { font-size: 12px !important; }
}
</style>
</head>
<body>
<div class="water-overlay"></div>
<div class="ending-container">
  <div class="ending-title">结 局 A · 沉 沦</div>
  <div class="ending-content">
    <p>你跳了下去。</p>
    <p>水比想象中暖。你一直往下沉，没有到底。</p>
    <p>下面有光。不是灯光，是一种发白的、浑浊的光。光里有人影，很多，站着，不动。</p>
    <p>其中一个转过身来。你看不清脸，但它朝你伸出了手。</p>
    <p class="epilogue">
      后来井湾村多了一户人家。没人记得他们是什么时候搬来的，但所有人都觉得他们一直在这里。<br><br>
      户口本上有你的名字。照片上的人你不认识，但邻居说那就是你。
    </p>
  </div>
  <div class="ending-progress" id="progressText"></div>
  <div class="ending-actions">
    <button class="restart-btn" onclick="restart()">重 新 开 始</button>
  </div>
</div>

<script>
function restart() {
  if (confirm('确定要重新开始吗？所有进度将被清除。')) {
    sessionStorage.clear();
    window.location.href = 'home.html';
  }
}
</script></body>
</html>
