<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f5f5;
    color: #333;
    font-size: 15px;
    min-height: 100vh;
  }
  .top-banner { background: #c41e3a; color: #fff; padding: 4px 0; font-size: 12px; }
  .top-banner .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; }
  .site-header { background: #fff; border-bottom: 3px solid #c41e3a; padding: 16px 0; position: relative; z-index: 100; }
  .site-header .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
  .logo-area { display: flex; align-items: center; gap: 12px; }
  .logo { width: 50px; height: 50px; background: #c41e3a; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
  .site-title { font-size: 24px; color: #c41e3a; font-weight: bold; letter-spacing: 2px; }
  .site-subtitle { font-size: 12px; color: #999; letter-spacing: 3px; margin-top: 2px; }
  .nav { background: #c41e3a; }
  .nav .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 0; }
  .nav a { color: #fff; text-decoration: none; padding: 12px 20px; font-size: 14px; display: block; transition: background 0.2s; }
  .nav a:hover { background: #a01830; }
  .main-content { max-width: 900px; margin: 30px auto; padding: 0 20px; }
  .breadcrumb { font-size: 13px; color: #999; margin-bottom: 20px; }
  .breadcrumb a { color: #666; text-decoration: none; }
  /* 密码输入区 */
  .password-box {
    background: #fff;
    border-radius: 6px;
    padding: 50px 40px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .password-box .lock-icon {
    font-size: 48px;
    color: #c41e3a;
    margin-bottom: 20px;
  }
  .password-box h2 {
    font-size: 20px;
    color: #333;
    margin-bottom: 8px;
  }
  .password-box .archive-desc {
    font-size: 14px;
    color: #888;
    margin-bottom: 30px;
  }
  .password-input-group {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .password-digit {
    width: 50px;
    height: 60px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    border: 2px solid #ddd;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }
  .password-digit:focus { border-color: #c41e3a; }
  .password-hint {
    font-size: 13px;
    color: #999;
    font-style: italic;
    margin-bottom: 20px;
  }
  .password-error {
    color: #c41e3a;
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 12px;
  }
  .btn-submit {
    background: #c41e3a;
    color: #fff;
    border: none;
    padding: 10px 40px;
    font-size: 15px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-submit:hover { background: #a01830; }
  .btn-back {
    background: #f0f0f0;
    color: #666;
    border: none;
    padding: 10px 30px;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
    margin-left: 10px;
  }
  /* 档案内容区 */
  .archive-content {
    background: #fff;
    border-radius: 6px;
    padding: 40px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    display: none;
  }
  .archive-content.show { display: block; }
  .archive-content h2 {
    font-size: 22px;
    color: #c41e3a;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid #eee;
  }
  .archive-content .archive-meta {
    font-size: 13px;
    color: #999;
    margin-bottom: 24px;
  }
  .archive-content .archive-body {
    font-size: 15px;
    line-height: 2;
    color: #444;
  }
  .archive-content .archive-body p { margin-bottom: 14px; text-indent: 2em; }
  .archive-content .highlight { background: #fff3cd; padding: 0 4px; }
  .archive-content .classified {
    background: #fef0f0;
    border-left: 3px solid #c41e3a;
    padding: 16px 20px;
    margin: 20px 0;
    font-size: 14px;
    color: #666;
  }

/* 移动端适配 */
@media (max-width: 768px) {
  body { padding: 10px; }
  .container, .main-content, .content, .wrapper { max-width: 100% !important; width: 100% !important; padding: 0 10px !important; }
  table { display: block; overflow-x: auto; white-space: nowrap; }
  img { max-width: 100%; height: auto; }
  h1 { font-size: 20px !important; }
  h2 { font-size: 18px !important; }
  h3 { font-size: 16px !important; }
  p, li, td, th { font-size: 13px !important; line-height: 1.6 !important; }
  .person-section, .person-header { flex-direction: column !important; align-items: flex-start !important; }
  .avatar { width: 50px !important; height: 60px !important; }
}
@media (max-width: 480px) {
  h1 { font-size: 18px !important; }
  h2 { font-size: 16px !important; }
  p, li, td, th { font-size: 12px !important; }
}
</style>
</head>
<body>

<div class="top-banner">
  <div class="container">
    <span>欢迎访问景月镇人民政府官方网站</span>
    <span>无障碍浏览 | 繁體中文 | ^_^</span>
  </div>
</div>

<header class="site-header">
  <div class="container">

      <div class="logo">★</div>

        <div class="site-title">景月镇人民政府</div>

<div class="main-content">
  <div class="breadcrumb">
    <a href="home.html">首页</a> &gt; <a href="archive.html">镇史馆</a> &gt; <span id="crumbName">档案查阅</span>
  </div>

  <!-- 密码输入区 -->
  <div class="password-box" id="passwordBox">
    <div class="lock-icon">🔒</div>
    <h2 id="archiveTitle">档案查阅 · 需授权</h2>
    <p class="archive-desc" id="archiveDesc">本档案涉及敏感信息，需输入授权密码方可查阅。</p>
    <div class="password-input-group" id="inputGroup">
      <input type="text" class="password-digit" maxlength="1" data-index="0">
      <input type="text" class="password-digit" maxlength="1" data-index="1">
      <input type="text" class="password-digit" maxlength="1" data-index="2">
      <input type="text" class="password-digit" maxlength="1" data-index="3">
    </div>
    <p class="password-hint" id="passwordHint">提示：某些日期可能是关键。</p>
    <p class="password-error" id="passwordError"></p>
    <button class="btn-submit" onclick="verifyPassword()">确认查阅</button>
    <button class="btn-back" onclick="window.location.href='archive.html'">返回</button>
  </div>

  <!-- 档案内容区 -->
  <div class="archive-content" id="archiveContent">
    <h2 id="contentTitle"></h2>
    <div class="archive-meta" id="contentMeta"></div>
    <div class="archive-body" id="contentBody"></div>
    <div style="text-align:center;margin-top:30px;">
      <button class="btn-back" onclick="window.location.href='archive.html'">返回镇史馆</button>
    </div>
  </div>
</div>

<script>
  // 档案配置
  var archives = {
    '2003': {
      title: '2003年洪涝灾害地质勘察报告',
      desc: '本档案为2003年7月景月镇洪涝灾害后的地质勘察报告，部分内容已脱敏。',
      hint: '提示：灾害发生的日期（月+日）。',
      password: '0714',
      meta: '档案编号：JYZ-2003-SW-0714 &nbsp;|&nbsp; 密级：内部 &nbsp;|&nbsp; 归档日期：2003-08-15',
      body: `
        <p>2003年7月14日，景月镇遭遇历史罕见特大洪水。景月湖水位超过警戒水位2.3米，沿湖多个村庄受灾。</p>
        <p>灾后地质勘察队对全镇地质结构进行了全面排查，重点区域为井湾村北侧及沉湖村沿岸。</p>
        <div class="classified">
          <p><b>勘察异常记录：</b></p>
          <p>1. 井湾村北井周边地下存在异常空腔，深度约22米，远超正常古井深度。</p>
          <p>2. 空腔内壁有人工修砌痕迹，经年代测定，早于明代建镇时期。</p>
          <p>3. 洪水期间，北井水位异常上涨，与周边地下水水位变化不同步。</p>
          <p>4. 水样检测发现不明有机物成分，建议进一步化验。</p>
        </div>
        <p>鉴于上述异常情况，建议对北井区域进行封闭管理，禁止无关人员靠近。</p>
        <p class="highlight">报告提交后，勘察队队长于三日后辞职，去向不明。</p>
      `
    },
    'teacher': {
      title: '退休教师档案 · 陈秀英',
      desc: '陈秀英老师的个人档案，涉及个人隐私，需授权查阅。',
      hint: '提示：陈秀英老师的退休年份。',
      password: '1995',
      meta: '档案编号：JYZ-EDU-1995-068 &nbsp;|&nbsp; 密级：内部 &nbsp;|&nbsp; 归档日期：1995-09-01',
      body: `
        <p><b>姓名：</b>陈秀英</p>
        <p><b>性别：</b>女</p>
        <p><b>出生年月：</b>1935年3月</p>
        <p><b>籍贯：</b>景月镇井湾村</p>
        <p><b>参加工作时间：</b>1958年8月</p>
        <p><b>退休时间：</b>1995年8月</p>
        <p><b>工作单位：</b>景月镇中心小学（原井湾村小学）</p>
        <p><b>职称：</b>小学高级教师</p>
        <p><b>任教年限：</b>37年</p>
        <div class="classified">
          <p><b>备注：</b></p>
          <p>陈秀英同志退休后主动承担井湾村村志整理工作，历时数年，积累手稿十余本。</p>
          <p>2003年7月14日洪灾中失踪，遗体三日后于下游发现。</p>
          <p>其整理的村志手稿大部分被水浸泡损坏，仅存残页。</p>
          <p class="highlight">残页中多次提及"井下的东西"、"井底有砖室"等内容，真实性待考。</p>
        </div>
      `
    },
    'secretary': {
      title: '村支书工作记录 · 张国强',
      desc: '沉湖村原党支部书记张国强的工作记录，需授权查阅。',
      hint: '提示：张国强同志的出生年份。',
      password: '1958',
      meta: '档案编号：JYZ-DJ-2003-045 &nbsp;|&nbsp; 密级：内部 &nbsp;|&nbsp; 归档日期：2003-07-20',
      body: `
        <p><b>姓名：</b>张国强</p>
        <p><b>性别：</b>男</p>
        <p><b>出生年月：</b>1958年5月</p>
        <p><b>籍贯：</b>景月镇沉湖村</p>
        <p><b>职务：</b>沉湖村党支部书记</p>
        <p><b>任职时间：</b>1998年-2003年</p>
        <p><b>牺牲时间：</b>2003年7月14日</p>
        <p><b>享年：</b>45岁</p>
        <div class="classified">
          <p><b>工作记录摘要：</b></p>
          <p>2003年7月10日：接到镇里防汛通知，安排村民转移。</p>
          <p>2003年7月12日：沉湖水位超警戒，赴井湾村了解情况。</p>
          <p>2003年7月13日：陈秀英反映北井异常，实地查看后上报镇里。</p>
          <p>2003年7月14日凌晨：堤坝决口，带队赴北井救人，失踪。</p>
          <p class="highlight">最后一条微博写道："井里的东西，不是水。"</p>
        </div>
        <p>张国强同志在抗洪抢险中英勇牺牲，被追授"抗洪抢险先进个人"称号。</p>
      `
    },
    'well_survey': {
      title: '北井深度勘测记录',
      desc: '1958年对北井进行的深度勘测记录，属绝密档案。',
      hint: '提示：勘测年份，也是一位烈士的出生年份。',
      password: '1958',
      meta: '档案编号：JYZ-1958-WELL-001 &nbsp;|&nbsp; 密级：绝密 &nbsp;|&nbsp; 归档日期：1958-11-20',
      body: `
        <p><b>勘测时间：</b>1958年10月</p>
        <p><b>勘测地点：</b>景月镇井湾村北井</p>
        <p><b>勘测人员：</b>省地质勘察队第三组</p>
        <div class="classified">
          <p><b>勘测记录：</b></p>
          <p>1. 井口直径约1.2米，井壁为青砖砌筑，砌筑年代待考。</p>
          <p>2. 使用绳索垂测，下放至74米处仍未触底，绳索末端有明显啃咬痕迹。</p>
          <p>3. 井下水温异常，常年保持在4摄氏度左右，与周边地下水温度不符。</p>
          <p>4. 下放至50米处时，勘测队员听到井下传来敲击声，节奏规律，疑似人工信号。</p>
          <p>5. 水样送检，发现不明有机物成分，含有与地表生物不同的氨基酸结构。</p>
        </div>
        <p class="highlight">勘测结束后，第三组3名队员中有2人申请调离，1人于次年失踪。档案封存，禁止查阅。</p>
        <p style="margin-top:16px;font-size:13px;color:#666;">（注：当地民谣有云"井深七丈四，井底有砖室"，与勘测数据吻合。）</p>
      `
    }
  };

  var currentType = '';

  // 初始化
  function init() {
    var params = new URLSearchParams(window.location.search);
    currentType = params.get('type') || '2003';
    var archive = archives[currentType];
    if (!archive) {
      document.getElementById('archiveTitle').textContent = '档案不存在';
      return;
    }
    document.getElementById('archiveTitle').textContent = archive.title + ' · 需授权';
    document.getElementById('archiveDesc').textContent = archive.desc;
    document.getElementById('passwordHint').textContent = archive.hint;
    document.getElementById('crumbName').textContent = archive.title;

    // 密码位数调整
    var inputGroup = document.getElementById('inputGroup');
    inputGroup.innerHTML = '';
    for (var i = 0; i < archive.password.length; i++) {
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'password-digit';
      input.maxLength = 1;
      input.dataset.index = i;
      inputGroup.appendChild(input);
    }

    // 自动跳转下一格
    var digits = document.querySelectorAll('.password-digit');
    digits.forEach(function(d, i) {
      d.addEventListener('input', function() {
        if (this.value && i < digits.length - 1) digits[i+1].focus();
      });
      d.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !this.value && i > 0) digits[i-1].focus();
        if (e.key === 'Enter') verifyPassword();
      });
    });
    digits[0].focus();
  }

  function verifyPassword() {
    var archive = archives[currentType];
    var digits = document.querySelectorAll('.password-digit');
    var pwd = Array.from(digits).map(function(d) { return d.value; }).join('');
    if (pwd === archive.password) {
      // 显示档案内容
      document.getElementById('passwordBox').style.display = 'none';
      var content = document.getElementById('archiveContent');
      content.classList.add('show');
      document.getElementById('contentTitle').textContent = archive.title;
      document.getElementById('contentMeta').innerHTML = archive.meta;
      document.getElementById('contentBody').innerHTML = archive.body;
      // 发现线索
      try {
        var saved = sessionStorage.getItem('jingyue_save');
        var state = saved ? JSON.parse(saved) : { discoveries: {}, fearLayer: 0 };
        if (!state.discoveries) state.discoveries = {};
        state.discoveries['archive_' + currentType] = true;
        sessionStorage.setItem('jingyue_save', JSON.stringify(state));
        // 解锁井深勘测记录后触发50%变红
        if (currentType === 'well_survey') {
          sessionStorage.setItem('well_survey_opened', '1');
        }
      } catch(e) {}
    } else {
      document.getElementById('passwordError').textContent = '密码错误，请重试。';
      digits.forEach(function(d) { d.value = ''; });
      digits[0].focus();
    }
  }

  init();
</script>

</body>
